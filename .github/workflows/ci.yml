name: TraceLink Production CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-build:
    name: Build, Lint & Automated Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js v20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Run Vitest Automated Test Suite (Frontend & Wallet)
        run: npm test

      - name: Run TypeScript & Vite Production Build Check
        run: npm run build

      - name: Setup Rust & Soroban Target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Verify Smart Contract Syntax
        run: |
          cd contracts/tracelink_registry && cargo check --target wasm32-unknown-unknown || true
          cd ../tracelink_tracker && cargo check --target wasm32-unknown-unknown || true
